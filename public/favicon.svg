  <g stroke="#e8ecea" stroke-width="2.1" stroke-linecap="round" fill="none">
    <path d="M4.5 5.5 L16.8 14.2"/>
    <path d="M3.2 14.2 L16.2 15.6"/>
    <path d="M7.5 26.5 L17 18.2"/>
    <path d="M20.6 16.6 L28 18.4"/>
  </g>
  <circle cx="18.4" cy="16.4" r="2.6" fill="#93b4ec"/>
</svg>
